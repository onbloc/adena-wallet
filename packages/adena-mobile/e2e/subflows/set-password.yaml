appId: ${APP_ID}
---
- extendedWaitUntil:
    visible: Set a password
    timeout: 10000
- tapOn:
    id: password-input
- inputText: ${PASSWORD}
- runFlow: dismiss-keyboard.yaml
- tapOn:
    id: password-confirm
- inputText: ${PASSWORD}
- runFlow: dismiss-keyboard.yaml
- tapOn:
    id: password-submit
- extendedWaitUntil:
    visible:
      id: home-send
    timeout: 60000
