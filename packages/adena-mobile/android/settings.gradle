// Packages are resolved with node, like the Podfile does, so the build works
// whether Yarn hoists them to the workspace root or keeps them in this package.
pluginManagement {
    def resolved = ["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', {paths: [require.resolve('react-native/package.json')]})"]
        .execute(null, rootDir).text.trim()
    includeBuild(new File(resolved).parent)
}
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'AdenaMobile'
include ':app'
includeBuild(new File(["node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', {paths: [require.resolve('react-native/package.json')]})"]
    .execute(null, rootDir).text.trim()).parent)
