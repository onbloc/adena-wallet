# Standalone pnpm project: excluded from the repository workspace so mobile
# dependency changes never touch the extension/module lockfile.
# Keep the policies below in sync with the root pnpm-workspace.yaml.

# Mirrors the Renovate minimumReleaseAge policy (minutes; 7 days).
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # First-party package, released by this team.
  - '@adena-wallet/sdk'
  # Exact versions @adena-wallet/sdk 0.1.3 pins; all clear the 7-day window by
  # 2026-11-20 and these entries can go then.
  - '@babel/runtime@7.29.14'
  - 'ox@0.14.65'
  - 'viem@2.57.19'

overrides:
  # Security floors for transitive dependencies.
  postcss: 8.5.32
  serialize-javascript@^6.0.2: 7.1.4
  tar@^6.0.5: 7.5.22
  tar@^6.1.11: 7.5.22
  tar@^6.2.1: 7.5.22
  uuid@^8.3.2: 11.1.1
  uuid@^9.0.0: 11.1.1
  ws: 8.22.2
  # Keep a single copy of the chain clients and their codecs.
  '@bufbuild/protobuf': 2.17.0
  '@gnolang/tm2-js-client': 3.3.0
  '@gnolang/tm2-rpc': 2.0.2
  '@cosmjs/amino': 0.39.0
  '@cosmjs/crypto': 0.39.0
  '@cosmjs/ledger-amino': 0.39.0
  '@cosmjs/proto-signing': 0.39.0
  # 2.3+ rejects the Infinity limit @cosmjs/encoding passes to bech32.decode.
  '@scure/base@^2.0.0': 2.2.0

# Dependency install scripts stay off; each one must be listed here.
allowBuilds:
  # Optional native accelerators for ws.
  bufferutil: false
  utf-8-validate: false
  # Binaries ship as optional platform packages; the script only verifies them.
  esbuild: false
  # Only checks the installed version.
  protobufjs: false
  # Writes a Firebase JS SDK default config; RN Firebase reads the native config files instead.
  '@firebase/util': false
  # Native addon build; the browser field maps the package to its pure-JS version.
  tiny-secp256k1: false
