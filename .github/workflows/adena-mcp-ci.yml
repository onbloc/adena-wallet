name: adena-mcp CI

on:
  pull_request:
    paths:
      - misc/adena-mcp/**
      - .github/workflows/adena-mcp-ci.yml
  push:
    branches:
      - main
    paths:
      - misc/adena-mcp/**

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: misc/adena-mcp
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: misc/adena-mcp/go.mod
          cache-dependency-path: misc/adena-mcp/go.sum

      - name: Vet
        run: go vet ./...

      # The race detector needs cgo, which the Windows runner lacks by default.
      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            go test ./...
          else
            go test -race ./...
          fi

      - name: Build binaries
        run: go build ./apps/...

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: misc/adena-mcp/go.mod
          cache-dependency-path: misc/adena-mcp/go.sum

      # Built from source so it matches the module's Go version; release
      # binaries can lag behind the go directive in go.mod.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.6.1
          install-mode: goinstall
          working-directory: misc/adena-mcp
          args: --config .golangci.yaml
