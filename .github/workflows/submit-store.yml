name: Submit To Stores

# Submits a release tag to the Chrome Web Store and addons.mozilla.org (listed)
# for review. Manual only: a store submission cannot be taken back, so it is
# kept apart from the tag-triggered QA builds in build-deploy.yml and
# build-firefox-xpi.yml.
#
# Jobs run in the `store-release` environment; add required reviewers to it so
# every submission needs an explicit approval.
#
# Secrets:
#   Chrome:  CWS_PUBLISHER_ID, CWS_EXTENSION_ID, CWS_CLIENT_ID,
#            CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN
#   Firefox: AMO_API_KEY, AMO_API_SECRET

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to submit (e.g. v1.22.0)
        required: true
      target:
        description: Store(s) to submit to
        type: choice
        default: both
        options:
          - both
          - chrome
          - firefox
      chrome_publish_type:
        description: Chrome - publish right after approval, or stage it for a manual publish
        type: choice
        default: STAGED_PUBLISH
        options:
          - STAGED_PUBLISH
          - DEFAULT_PUBLISH

permissions:
  contents: read

jobs:
  chrome:
    if: inputs.target == 'both' || inputs.target == 'chrome'
    runs-on: ubuntu-latest
    environment: store-release
    env:
      PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check tag matches package version
        env:
          TAG_NAME: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./packages/adena-extension/package.json').version")
          if [ "$TAG_NAME" != "v${version}" ]; then
            echo "::error::tag $TAG_NAME does not match package version v${version}"
            exit 1
          fi

      - name: Build project
        run: |
          yarn
          yarn build
        env:
          WEB3_AUTH_LEGACY_CLIENT_ID: ${{ secrets.WEB3_AUTH_LEGACY_CLIENT_ID }}
          GOOGLE_LEGACY_VERIFIER: ${{ secrets.GOOGLE_LEGACY_VERIFIER }}
          GOOGLE_LEGACY_CLIENT_ID: ${{ secrets.GOOGLE_LEGACY_CLIENT_ID }}
          WEB3_AUTH_PRODUCTION_CLIENT_ID: ${{ secrets.WEB3_AUTH_PRODUCTION_CLIENT_ID }}
          GOOGLE_PRODUCTION_VERIFIER: ${{ secrets.GOOGLE_PRODUCTION_VERIFIER }}
          GOOGLE_PRODUCTION_CLIENT_ID: ${{ secrets.GOOGLE_PRODUCTION_CLIENT_ID }}
          WEB3_AUTH_EMAIL_CLIENT_ID: ${{ secrets.WEB3_AUTH_EMAIL_CLIENT_ID }}
          EMAIL_VERIFIER_NAME: ${{ secrets.EMAIL_VERIFIER_NAME }}
          WEB3_AUTH_X_CLIENT_ID: ${{ secrets.WEB3_AUTH_X_CLIENT_ID }}
          X_VERIFIER_NAME: ${{ secrets.X_VERIFIER_NAME }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_AUTH0_DOMAIN: ${{ secrets.X_AUTH0_DOMAIN }}

      - name: Package zip
        run: |
          cd packages/adena-extension/dist
          zip -r "$GITHUB_WORKSPACE/chrome.zip" . -x '*.DS_Store' -x '__MACOSX/*'

      - name: Get access token
        env:
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          token=$(curl -sSf https://oauth2.googleapis.com/token \
            -d client_id="$CLIENT_ID" \
            -d client_secret="$CLIENT_SECRET" \
            -d refresh_token="$REFRESH_TOKEN" \
            -d grant_type=refresh_token | jq -r .access_token)
          echo "::add-mask::$token"
          echo "CWS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Upload to Chrome Web Store
        run: |
          base="https://chromewebstore.googleapis.com"
          item="publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}"
          res=$(curl -sS -X POST -H "Authorization: Bearer $CWS_TOKEN" \
            -T chrome.zip "$base/upload/v2/$item:upload")
          echo "$res"
          state=$(echo "$res" | jq -r .uploadState)
          # Large packages are processed asynchronously.
          for _ in $(seq 1 30); do
            [ "$state" = "IN_PROGRESS" ] || break
            sleep 10
            state=$(curl -sS -H "Authorization: Bearer $CWS_TOKEN" \
              "$base/v2/$item:fetchStatus" | jq -r .lastAsyncUploadState)
          done
          if [ "$state" != "SUCCEEDED" ]; then
            echo "::error::upload ended in state $state"
            exit 1
          fi

      - name: Submit for review
        env:
          PUBLISH_TYPE: ${{ inputs.chrome_publish_type }}
        run: |
          res=$(curl -sS -X POST -H "Authorization: Bearer $CWS_TOKEN" \
            -H 'Content-Type: application/json' \
            -d "{\"publishType\":\"$PUBLISH_TYPE\"}" \
            "https://chromewebstore.googleapis.com/v2/publishers/${PUBLISHER_ID}/items/${EXTENSION_ID}:publish")
          echo "$res"
          if echo "$res" | jq -e .error >/dev/null; then
            exit 1
          fi

  firefox:
    if: inputs.target == 'both' || inputs.target == 'firefox'
    runs-on: ubuntu-latest
    environment: store-release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Check tag matches package version
        env:
          TAG_NAME: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./packages/adena-extension/package.json').version")
          if [ "$TAG_NAME" != "v${version}" ]; then
            echo "::error::tag $TAG_NAME does not match package version v${version}"
            exit 1
          fi

      # AMO reviewers rebuild bundled code, so the tagged source goes along.
      - name: Package source code
        run: git archive --format=zip -o "$RUNNER_TEMP/source.zip" HEAD

      - name: Build project
        run: |
          yarn
          yarn build:firefox
        env:
          WEB3_AUTH_LEGACY_CLIENT_ID: ${{ secrets.WEB3_AUTH_LEGACY_CLIENT_ID }}
          GOOGLE_LEGACY_VERIFIER: ${{ secrets.GOOGLE_LEGACY_VERIFIER }}
          GOOGLE_LEGACY_CLIENT_ID: ${{ secrets.GOOGLE_LEGACY_CLIENT_ID }}
          WEB3_AUTH_PRODUCTION_CLIENT_ID: ${{ secrets.WEB3_AUTH_PRODUCTION_CLIENT_ID }}
          GOOGLE_PRODUCTION_VERIFIER: ${{ secrets.GOOGLE_PRODUCTION_VERIFIER }}
          GOOGLE_PRODUCTION_CLIENT_ID: ${{ secrets.GOOGLE_PRODUCTION_CLIENT_ID }}
          WEB3_AUTH_EMAIL_CLIENT_ID: ${{ secrets.WEB3_AUTH_EMAIL_CLIENT_ID }}
          EMAIL_VERIFIER_NAME: ${{ secrets.EMAIL_VERIFIER_NAME }}
          WEB3_AUTH_X_CLIENT_ID: ${{ secrets.WEB3_AUTH_X_CLIENT_ID }}
          X_VERIFIER_NAME: ${{ secrets.X_VERIFIER_NAME }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_AUTH0_DOMAIN: ${{ secrets.X_AUTH0_DOMAIN }}

      # Listed review takes longer than a job should wait; --approval-timeout 0
      # returns once the version is submitted.
      - name: Submit to AMO (listed)
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: |
          npx --yes web-ext@10 sign \
            --source-dir packages/adena-extension/dist-firefox \
            --channel listed \
            --upload-source-code "$RUNNER_TEMP/source.zip" \
            --approval-timeout 0
